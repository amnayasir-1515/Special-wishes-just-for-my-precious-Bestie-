<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For My Forever Bestie❤️🫂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#e6d3ff; --bg2:#f8cfe6; --bg3:#ffe3ef;
  --card:rgba(255,255,255,.93);
  --ink:#5a2d82; --ink2:#8a5fae;
  --accent:#e0559f; --accent2:#9b6bf2;
  --soft:#fdeaf6; --line:#e3c6f5;
  --paper:#fffaf6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  background-color:#f3d9ff;
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;
}
#floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;bottom:-60px;opacity:.0;animation:rise linear infinite;will-change:transform}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
  10%{opacity:.75}
  50%{transform:translate3d(24px,-55vh,0) rotate(20deg)}
  90%{opacity:.6}
  100%{transform:translate3d(-16px,-115vh,0) rotate(-15deg);opacity:0}
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 8px;pointer-events:none}
.top>*{pointer-events:auto}
.round{width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:#8b4fc0;font-size:1.2rem;font-weight:700;
  box-shadow:0 4px 14px rgba(150,90,200,.28);cursor:pointer;display:flex;align-items:center;justify-content:center}
.round[hidden]{display:none}
.dots{display:flex;gap:5px;flex:1;justify-content:center;padding-right:42px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(155,107,242,.28);transition:.3s}
.dots i.on{background:var(--accent2);transform:scale(1.25)}

#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:48px;height:48px;border-radius:50%;
  border:2px solid #f3c6e3;background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 6px 16px rgba(150,90,200,.28);
  display:flex;align-items:center;justify-content:center}

main{position:relative;z-index:5;width:100%;padding:72px 16px 80px;display:flex;justify-content:center}
.card{
  width:min(100%,410px);text-align:center;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:30px;padding:28px 22px 26px;
  box-shadow:0 18px 44px rgba(160,90,200,.22),inset 0 0 0 1px rgba(255,255,255,.7);
  opacity:0;transform:translateY(18px) scale(.97);
}
.card.in{opacity:1;transform:none;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.9,.3,1.2)}
.card.out{opacity:0;transform:translateY(-10px) scale(.98);transition:.2s}

.avatar{position:relative;width:134px;height:134px;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#ffeaf7 70%);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(200,110,200,.22)}
.avatar::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px dashed var(--accent);animation:spin 24s linear infinite}
.avatar span{font-size:3.4rem;line-height:1;animation:bob 2.4s ease-in-out infinite;display:block}
.avatar span.sm{font-size:2.1rem;letter-spacing:-3px;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

h1,h2{margin:0 0 8px;font-family:'Pacifico','Poppins',cursive;font-weight:400;color:var(--ink);line-height:1.3}
h1{font-size:1.85rem}
h2{font-size:1.5rem}
.sub{margin:0 0 20px;font-size:.92rem;line-height:1.55;color:var(--ink2)}
.hint{font-size:.82rem;color:var(--ink2);margin:0 0 14px}

.btn{font-family:inherit;font-size:.95rem;font-weight:600;color:#fff;border:none;border-radius:999px;padding:13px 26px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  box-shadow:0 8px 20px rgba(170,90,210,.35);transition:transform .15s,opacity .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--accent)}
.row2{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:56px}
button:focus-visible{outline:3px solid #ffd54a;outline-offset:3px}

.big{font-size:clamp(2.1rem,10vw,2.9rem);font-weight:800;letter-spacing:.1em;margin:18px 0 6px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;
  min-height:1.3em;line-height:1.3}
.big.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}

/* puzzle */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(100%,300px);margin:0 auto 14px;
  padding:6px;border-radius:18px;border:3px solid var(--accent);background:#fff}
.tile{aspect-ratio:1;border-radius:9px;background-size:300% 300%;cursor:pointer;border:3px solid transparent;transition:transform .2s,border-color .2s}
.tile.sel{border-color:#ffb300;transform:scale(.9)}
.board.done{animation:glow 1s ease}
.board.done .tile{cursor:default;border-radius:0;border:0}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,120,210,.5)}}

/* scratch */
.scratch{position:relative;height:170px;border-radius:18px;overflow:hidden;margin-bottom:16px;
  background:linear-gradient(135deg,#fff,#ffe3f4);display:flex;align-items:center;justify-content:center;padding:16px;
  font-weight:600;font-size:1.02rem;line-height:1.5;color:#5b1a7c;box-shadow:inset 0 0 0 2px var(--line)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .6s}
.scratch canvas.gone{opacity:0;pointer-events:none}

/* memories */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.flip{perspective:700px;height:150px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.flip .in2{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in2{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;color:#fff;
  box-shadow:0 6px 16px rgba(150,70,180,.25)}
.face.f{background:linear-gradient(140deg,#c4a0ff,#ff9ecb);border:2px dashed rgba(255,255,255,.8)}
.face.f b{font-size:2.3rem;font-weight:400}
.face.f small{font-size:.72rem;margin-top:6px;opacity:.95}
.face.f.photo{border:3px solid #fff;align-items:flex-end;justify-content:flex-start;background-size:cover;
  background-position:center;padding:9px}
.face.f.photo small{background:rgba(40,10,60,.55);backdrop-filter:blur(2px);padding:4px 9px;border-radius:9px;
  font-size:.68rem;font-weight:600;line-height:1.3;box-shadow:none;margin:0;max-width:100%}
.face.b{background:linear-gradient(140deg,#9b6bf2,#e879b9);transform:rotateY(180deg);font-size:.78rem;line-height:1.4;font-weight:500}

.memstack{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.memnav{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 4px 12px rgba(150,70,180,.25);font-size:1.3rem;line-height:1;color:var(--accent2);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.memnav:active{transform:scale(.9)}
.polaroid{width:210px;background:#fff;border-radius:14px;padding:10px 10px 14px;cursor:pointer;
  box-shadow:0 12px 28px rgba(150,70,180,.3);transform:rotate(var(--r,-2deg));transition:transform .18s,opacity .18s;
  touch-action:pan-y}
.pphoto{width:100%;aspect-ratio:1/1;border-radius:9px;background:linear-gradient(140deg,#c4a0ff,#ff9ecb);
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;color:#fff}
.pcap{margin-top:10px;text-align:center;font-family:'Pacifico',cursive;font-weight:400;font-size:1rem;
  color:var(--ink);line-height:1.35}
.mdots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.mdots i{width:6px;height:6px;border-radius:50%;background:rgba(155,107,242,.28);transition:.2s}
.mdots i.on{background:var(--accent2);transform:scale(1.35)}

.lightbox{position:fixed;inset:0;background:rgba(30,5,55,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:90;padding:26px;opacity:0;pointer-events:none;transition:opacity .25s}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox-inner{position:relative;max-width:360px;width:100%;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45);transform:scale(.82);transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.lightbox.show .lightbox-inner{transform:scale(1)}
.lightbox-inner img{width:100%;max-height:62vh;object-fit:cover;display:block}
.lightbox-cap{padding:16px 18px;font-size:.92rem;color:var(--ink);line-height:1.55;text-align:center;font-weight:500}
.lb-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(20,0,40,.5);color:#fff;font-size:1rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}

/* wrapped */
.wr{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;margin:8px 0;border-radius:14px;
  background:rgba(255,255,255,.55);border:1px solid var(--line);font-size:.85rem;opacity:0;transform:translateX(-14px);
  animation:slidein .5s forwards}
.wr .l{flex:1}
.wr .v{font-weight:800;color:var(--accent);font-size:1.02rem}
@keyframes slidein{to{opacity:1;transform:none}}

/* our little world */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:300px;overflow-y:auto;
  margin-bottom:16px;padding:2px 2px 4px}
.wcard{background:var(--soft);border-radius:14px;padding:12px 10px;text-align:left;font-size:.8rem;
  line-height:1.4;font-weight:600;color:var(--ink);box-shadow:0 3px 10px rgba(150,70,180,.12);
  opacity:0;transform:translateY(10px);animation:wcardin .45s forwards}
.wcard span{display:block;font-size:1.3rem;margin-bottom:6px}
@keyframes wcardin{to{opacity:1;transform:none}}

/* balloons */
.sky{position:relative;height:250px;border-radius:18px;overflow:hidden;margin-bottom:16px;
  background:linear-gradient(#fff8fc,#f6ecff);box-shadow:inset 0 0 0 2px var(--line)}
.bl{position:absolute;width:52px;height:64px;border:none;padding:0;cursor:pointer;background:none;animation:sway 3s ease-in-out infinite}
.bl i{display:block;width:100%;height:100%;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),transparent 35%),var(--c);box-shadow:inset -6px -8px 12px rgba(0,0,0,.15)}
.bl::after{content:"";position:absolute;left:50%;bottom:-16px;width:2px;height:22px;background:rgba(120,60,150,.45);transform:translateX(-50%)}
.bl::before{content:"";position:absolute;left:50%;bottom:-3px;border:5px solid transparent;border-bottom:7px solid var(--c);border-top:0;transform:translateX(-50%)}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.bl.popped{animation:none;transform:scale(1.6);opacity:0;transition:.18s}
.msg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);background:#fff;color:#5b1a7c;font-weight:600;font-size:.95rem;
  padding:12px 18px;border-radius:14px;border:2px solid var(--accent);box-shadow:0 10px 24px rgba(120,0,140,.3);width:max-content;max-width:86%;
  opacity:0;pointer-events:none;z-index:3}
.msg.show{animation:msgin 2.2s forwards}
@keyframes msgin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* envelope + letter */
.env{position:relative;width:250px;height:156px;margin:8px auto 10px;cursor:pointer;perspective:700px;transition:opacity .5s,transform .5s}
.env .bk{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#b48cf7,#e58fc4)}
.env .fr{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#c7a4fa,#f5a3cf);clip-path:polygon(0 100%,0 30%,50% 62%,100% 30%,100% 100%)}
.env .fp{position:absolute;left:0;right:0;top:0;height:82px;background:linear-gradient(180deg,#a67df0,#e492c9);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .7s ease;border-radius:10px 10px 0 0}
.env .seal{position:absolute;left:50%;top:60px;transform:translateX(-50%);font-size:1.5rem;z-index:2;transition:opacity .3s}
.env.open .fp{transform:rotateX(180deg)}
.env.open .seal{opacity:0}
.env.gone{opacity:0;transform:scale(.8);pointer-events:none;height:0;margin:0;overflow:hidden}
.paper{display:none;text-align:left;background:var(--paper);border-radius:14px;padding:16px 16px 14px;max-height:270px;overflow:auto;
  font-size:.86rem;line-height:1.75;color:var(--ink);white-space:pre-wrap;border-left:5px solid var(--accent);
  box-shadow:0 8px 22px rgba(90,0,120,.2);margin-bottom:16px;unicode-bidi:plaintext}
.paper.show{display:block;animation:pop .5s}

/* cake */
.cake{position:relative;width:200px;height:190px;margin:4px auto 6px}
.plate{position:absolute;left:-14px;right:-14px;bottom:0;height:16px;border-radius:50%;background:linear-gradient(#fff,#e8c6f5);box-shadow:0 6px 12px rgba(100,0,120,.25)}
.t1,.t2{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px;
  background-image:radial-gradient(circle,#fff 1.5px,transparent 2px);background-size:14px 14px}
.t1{bottom:10px;width:200px;height:64px;background-color:#ffa3cf}
.t2{bottom:70px;width:142px;height:54px;background-color:#c4a4ff}
.t1::before,.t2::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:14px 14px 10px 10px;background:#fff;opacity:.95}
.candle{position:absolute;bottom:122px;width:12px;height:34px;padding:0;border:none;cursor:pointer;border-radius:3px;
  background:repeating-linear-gradient(45deg,#ffe066 0 6px,#ff9ecb 6px 12px)}
.candle::after{content:"";position:absolute;inset:-26px -14px -4px}
.flame{position:absolute;left:50%;top:-20px;width:12px;height:19px;transform:translateX(-50%);
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 70%,#fff6a8,#ffb300 55%,#ff5e00);
  box-shadow:0 0 14px 4px rgba(255,180,0,.65);animation:flick .25s infinite alternate}
@keyframes flick{from{transform:translateX(-50%) scale(1,1) rotate(-3deg)}to{transform:translateX(-50%) scale(.9,1.1) rotate(3deg)}}
.candle.out .flame{display:none}
.smoke{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:1.1rem;animation:smoke 1.2s forwards;pointer-events:none}
@keyframes smoke{to{transform:translate(-50%,-40px) scale(1.8);opacity:0}}

.wishline{min-height:1.6em;font-weight:600;color:var(--accent);margin:8px 0 16px;font-size:.95rem}
.rot{display:inline-block;min-width:8ch;transition:opacity .4s}
.fine{font-size:.78rem;color:var(--ink2);margin-top:14px}

/* passcode */
.pdots{display:flex;gap:10px;justify-content:center;margin:16px 0 22px}
.pdots i{display:block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent2);background:transparent;transition:background .15s}
.pdots i.fill{background:var(--accent2)}
.pdots.shake{animation:pshake .4s}
@keyframes pshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:250px;margin:0 auto 14px}
.pad button{font-family:inherit;aspect-ratio:1;border-radius:50%;border:none;background:#fff;
  box-shadow:0 4px 10px rgba(150,90,200,.2);font-size:1.25rem;font-weight:700;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.pad button:active{transform:scale(.92)}
.pad button.ghost2{background:transparent;box-shadow:none;color:var(--ink2);font-size:1.15rem}
.phint{min-height:1.3em;font-size:.82rem;color:var(--ink2);margin:2px 0 14px}

@media (prefers-reduced-motion:reduce){
  .fl,.avatar::before,.avatar span,.bl,.flame{animation:none}
}
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="top">
  <button class="round" id="back" aria-label="Go back" hidden>←</button>
  <div class="dots" id="dots" aria-hidden="true"></div>
</header>

<main><section class="card" id="card" aria-live="polite"></section></main>

<button id="music" aria-label="Toggle music">🔊</button>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-inner">
    <button class="lb-close" id="lbClose" aria-label="Close photo">✕</button>
    <img id="lbImg" alt="">
    <div class="lightbox-cap" id="lbCap"></div>
  </div>
</div>

<script>
/* ============ EDIT ME ============ */
const PASSCODE = '710158';

/* STICKERS — paste a Bubu & Dudu sticker link/image between the quotes for
   whichever screen you want, e.g. locked: 'https://.../bubu-lock.png'
   Leave '' empty and that screen keeps its emoji as-is. */
const STICKERS = {
  locked:      'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubu-2-1/sticker_24.gif?67cbc78a6d6ab58d2c2bdffa15cda264&d=200x200',   // passcode screen — default, before typing
  lockedRight: 'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubududu-love/sticker_3.gif?56d7eabefca9721bf3c285693ef69601&d=200x200',   // passcode screen — shown when the code is CORRECT
  lockedWrong: 'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubu-3-1/sticker_18.gif?8b3f5a45f8a1bd09a2353974ff86ad27&d=200x200',   // passcode screen — shown when the code is WRONG
  intro:       'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubu-8/sticker_5.gif?7d6caa9e45a3b5772df496cefd414a8a&d=200x200',   // "Hey Hajra" opening screen
  ready:       'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubu-3-1/sticker_26.gif?8b3f5a45f8a1bd09a2353974ff86ad27&d=200x200',   // "Ready for it?" screen — default
  readyYes:    'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bbdd-hugging/sticker_4.gif?48ffac833ee69bfb04cc9b919ca576e3&d=200x200',   // "Ready for it?" screen — shown after tapping YES
  readyNo:     'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubu-8/sticker_19.gif?7d6caa9e45a3b5772df496cefd414a8a&d=200x200',   // "Ready for it?" screen — shown after tapping NO
  notNo:       'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bubududu-love/sticker_3.gif?56d7eabefca9721bf3c285693ef69601&d=200x200',   // "Not an option!" screen (after tapping No 3x)
  countdown:   'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bbdd-hugging/sticker_15.gif?48ffac833ee69bfb04cc9b919ca576e3&d=200x200',   // 3-2-1 countdown screen
  hug:         'https://s3.getstickerpack.com/storage/uploads/sticker-pack/bbdd-hugging/sticker_6.gif?48ffac833ee69bfb04cc9b919ca576e3&d=200x200',   // "Sending you a hug! I MISS YOU" screen

/* ---------- confetti / fireworks ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let W=0,H=0,parts=[],raf=0;
const COLORS = ['#ff4fa3','#c13cff','#7b2ff7','#ffd166','#ffffff','#ff8fd0','#5ee7ff'];
function resize(){
  const d = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*d; cv.height = H*d;
  cx.setTransform(d,0,0,d,0,0);
}
resize(); window.addEventListener('resize', resize);
function confetti(x,y,n=90,spread=1){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (3+Math.random()*7)*spread;
    parts.push({k:'c',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:6+Math.random()*6,h:4+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLORS[(Math.random()*COLORS.length)|0],a:1});
  }
  loop();
}
function rain(n=90){
  for (let i=0;i<n;i++){
    parts.push({k:'c',x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
      w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,
      c:COLORS[(Math.random()*COLORS.length)|0],a:1.4});
  }
  loop();
}
function burst(x,y){
  const c = COLORS[(Math.random()*4)|0];
  for (let i=0;i<46;i++){
    const a = i/46*Math.PI*2, s = 2+Math.random()*4.2;
    parts.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:Math.random()<.25?'#fff':c,a:1,d:.012+Math.random()*.01});
  }
  loop();
}
const HEART_EMOJI = ['💜','💕','💖','💗','💓','❤️','💛','✨'];
const BFF_EMOJI = ['🌸','🌷','🌹','💐','🤗','💜','💕','💖','✨','🎉','🥳','🦋'];
function heartBurst(x, y, n=24, list=HEART_EMOJI){
  for (let i=0;i<n;i++){
    const s = document.createElement('span');
    s.textContent = list[(Math.random()*list.length)|0];
    s.style.cssText = `position:fixed;left:${x}px;top:${y}px;font-size:${14+Math.random()*18}px;
      pointer-events:none;z-index:75;transform:translate(-50%,-50%);
      transition:transform 1.1s cubic-bezier(.15,.7,.3,1),opacity 1.1s ease;opacity:1`;
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*1.3 + Math.PI*0.85;
    const dist = 70 + Math.random()*130;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 40;
    const rot = (Math.random()-.5)*80;
    requestAnimationFrame(() => {
      s.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.25) rotate(${rot}deg)`;
      s.style.opacity = '0';
    });
    setTimeout(() => s.remove(), 1150);
  }
}
function heartShower(n=55, list=HEART_EMOJI){
  for (let i=0;i<n;i++){
    const s = document.createElement('span');
    s.textContent = list[(Math.random()*list.length)|0];
    const startX = Math.random()*W;
    const size = 16 + Math.random()*24;
    const dur = 2200 + Math.random()*2000;
    const delay = Math.random()*700;
    const drift = (Math.random()-.5)*160;
    s.style.cssText = `position:fixed;left:${startX}px;top:0;font-size:${size}px;
      pointer-events:none;z-index:75;will-change:transform,opacity`;
    document.body.appendChild(s);
    const anim = s.animate([
      { transform:`translate(-50%, ${H+40}px) rotate(0deg)`, opacity:0 },
      { transform:`translate(-50%, ${H*0.55}px) rotate(${drift>0?24:-24}deg)`, opacity:1, offset:.16 },
      { transform:`translate(calc(-50% + ${drift}px), -70px) rotate(${drift}deg)`, opacity:0 }
    ], { duration: dur, delay, easing:'cubic-bezier(.2,.6,.3,1)', fill:'forwards' });
    anim.onfinish = () => s.remove();
  }
}

function loop(){
  if (raf) return;
  const step = () => {
    cx.clearRect(0,0,W,H);
    parts = parts.filter(p => {
      p.x += p.vx; p.y += p.vy;
      cx.globalAlpha = Math.max(0, Math.min(1, p.a));
      cx.fillStyle = p.c;
      if (p.k === 'c'){
        p.vy += .22; p.vx *= .99; p.r += p.vr; p.a -= .0045;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
      } else {
        p.vy += .05; p.vx *= .985; p.vy *= .985; p.a -= p.d;
        cx.beginPath(); cx.arc(p.x,p.y,2.4,0,Math.PI*2); cx.fill();
      }
      return p.a > 0 && p.y < H+30;
    });
    cx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(step) : 0;
  };
  raf = requestAnimationFrame(step);
}

/* ---------- audio (music box + sfx) ---------- */
let AC=null, master=null, musicOn=true, loopT=0;
function initAudio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .35; master.connect(AC.destination);
    playMelody();
  }catch(e){ AC = null; }
}
function tone(f,t,d,v=.25,type='sine'){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
  const o2 = AC.createOscillator(), g2 = AC.createGain();
  o2.type = 'sine'; o2.frequency.value = f*2;
  g2.gain.setValueAtTime(.0001,t);
  g2.gain.exponentialRampToValueAtTime(v*.3,t+.01);
  g2.gain.exponentialRampToValueAtTime(.0001,t+d*.6);
  o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t+d);
}
const G4=392,A4=440,B4=493.88,C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99;
const MEL = [
  [G4,.75],[G4,.25],[A4,1],[G4,1],[C5,1],[B4,2],
  [G4,.75],[G4,.25],[A4,1],[G4,1],[D5,1],[C5,2],
  [G4,.75],[G4,.25],[G5,1],[E5,1],[C5,1],[B4,1],[A4,1],
  [F5,.75],[F5,.25],[E5,1],[C5,1],[D5,1],[C5,2]
];
function playMelody(){
  if (!AC) return;
  const beat = .5; let t = AC.currentTime + .05;
  MEL.forEach(([f,b]) => { tone(f,t,b*beat*1.7,.28); t += b*beat; });
  const total = t - AC.currentTime;
  loopT = setTimeout(playMelody, (total+1.4)*1000);
}
function sfx(kind){
  if (!AC || !musicOn) return;
  const t = AC.currentTime;
  if (kind==='pop'){
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(760,t); o.frequency.exponentialRampToValueAtTime(110,t+.13);
    g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.0001,t+.14);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.16);
  } else if (kind==='chime'){
    [880,1108.7,1318.5,1760].forEach((f,i)=>tone(f,t+i*.09,.6,.22));
  } else if (kind==='tick'){
    tone(660,t,.18,.3,'triangle');
  } else if (kind==='whoosh'){
    tone(330,t,.25,.15,'triangle');
  }
}
$('#music').addEventListener('click', () => {
  initAudio();
  musicOn = !musicOn;
  $('#music').textContent = musicOn ? '🔊' : '🔇';
  if (master) master.gain.setTargetAtTime(musicOn ? .35 : 0, AC.currentTime, .05);
});

  const box = $('#sc'), c = $('#cvs'), g = c.getContext('2d');
  const d = Math.min(2, window.devicePixelRatio||1);
  const w = box.offsetWidth, h = box.offsetHeight;
  c.width = w*d; c.height = h*d; g.scale(d,d);
  const grad = g.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,'#c9a6ff'); grad.addColorStop(.5,'#f59bc9'); grad.addColorStop(1,'#b892ff');
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  g.fillStyle = 'rgba(255,255,255,.35)';
  for (let i=0;i<40;i++){ g.beginPath(); g.arc(Math.random()*w,Math.random()*h,2+Math.random()*3,0,7); g.fill(); }
  g.fillStyle = '#fff'; g.font = '600 18px Poppins,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Scratch here ✨', w/2, h/2);
  g.globalCompositeOperation = 'destination-out';
  let down = false, strokes = 0, revealed = false;
  const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const scratch = e => {
    if (!down || revealed) return;
    const [x,y] = pt(e);
    g.beginPath(); g.arc(x,y,20,0,Math.PI*2); g.fill();
    if (++strokes % 8 === 0) check();
  };
  const check = () => {
    const data = g.getImageData(0,0,c.width,c.height).data;
    let clear = 0, total = 0;
    for (let i=3;i<data.length;i+=64){ total++; if (data[i] < 40) clear++; }
    if (clear/total > .45){
      revealed = true; c.classList.add('gone');
      sfx('chime'); confetti(...centerOf(box),130);
      $('#cont').disabled = false;
    }
  };
  c.addEventListener('pointerdown', e => { down = true; c.setPointerCapture(e.pointerId); scratch(e); });
  c.addEventListener('pointermove', scratch);
  c.addEventListener('pointerup', () => { down = false; check(); });
  c.addEventListener('pointercancel', () => { down = false; });
  $('#cont').onclick = next;
},

/* 5 — memories */
el => {
  el.innerHTML = `<h2>📸 Our Memories</h2>
    <p class="hint">Swipe through a few of our favourites</p>
    <div class="memstack">
      <button class="memnav" id="mprev" aria-label="Previous memory">‹</button>
      <div class="polaroid" id="polaroid">
        <div class="pphoto" id="pphoto"></div>
        <div class="pcap" id="pcap"></div>
      </div>
      <button class="memnav" id="mnext" aria-label="Next memory">›</button>
    </div>
    <div class="mdots" id="mdots">${MEMORIES.map(() => '<i></i>').join('')}</div>
    <button class="btn" id="cont">Read Wishes 🎁</button>`;
  let mi = 0;
  const poly = $('#polaroid'), photo = $('#pphoto'), cap = $('#pcap');
  const dots = [...el.querySelectorAll('#mdots i')];
  const render = () => {
    const m = MEMORIES[mi];
    if (m.img){ photo.style.backgroundImage = `url('${m.img}')`; photo.textContent = ''; }
    else { photo.style.backgroundImage = ''; photo.textContent = m.e; }
    cap.textContent = m.cap || m.t;
    poly.style.setProperty('--r', (mi % 2 === 0 ? -3 : 3) + 'deg');
    dots.forEach((d,i) => d.classList.toggle('on', i === mi));
  };
  const go = dir => {
    mi = (mi + dir + MEMORIES.length) % MEMORIES.length;
    sfx('tick');
    poly.style.transform = `rotate(${dir*8}deg) scale(.9)`; poly.style.opacity = '0';
    later(() => { render(); poly.style.transform = ''; poly.style.opacity = '1'; }, 140);
  };
  $('#mprev').onclick = () => go(-1);
  $('#mnext').onclick = () => go(1);
  poly.onclick = () => { const m = MEMORIES[mi]; if (m.img) openLightbox(m.img, m.t); };
  let sx = null;
  poly.addEventListener('pointerdown', e => { sx = e.clientX; });
  poly.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (dx > 40) go(-1); else if (dx < -40) go(1);
  });
  render();
  $('#cont').onclick = next;
},

/* 6 — wrapped */
el => {
  const rows = [
    ['😂','Times you made me laugh','Countless',''],
    ['🤝','Secrets kept safe','All of them',''],
    ['🫂','Times you had my back','Every time',''],
    ['🥰','Times I feel grateful for you','∞',''],
    ['💜','Best friend rating',100,'%'],
    ['🏆','Best friend ranking','#1','']
  ];
  el.innerHTML = `<h2>✨ Best Friend Stats</h2>
    <p class="hint">The official ${NAME} report</p>
    ${rows.map((r,i) => `<div class="wr" style="animation-delay:${i*.28}s"><span>${r[0]}</span><span class="l">${r[1]}</span><span class="v" data-n="${r[2]}" data-s="${r[3]}">0</span></div>`).join('')}
    <div style="margin-top:16px"><button class="btn" id="cont">One More Thing →</button></div>`;
  el.querySelectorAll('.v').forEach((v,i) => {
    const raw = v.dataset.n, suf = v.dataset.s;
    if (isNaN(+raw)){ later(() => v.textContent = raw, 300+i*280); return; }
    const to = +raw, start = performance.now()+ i*280, dur = 1200;
    const tick = now => {
      const p = Math.max(0, Math.min(1, (now-start)/dur));
      v.textContent = Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('en-US') + suf;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  $('#cont').onclick = next;
},

/* 7 — balloons */
el => {
  const msgs = ['Best. Friend. Ever. 🥰','So glad you exist 🌟',`My ${NICK[1]} 👑`,`You are my ${NICK[2]} 💜`,`${NICK[0]}, you\'re my sunshine ☀️`,`${NAME} = my safe place 🏡`];
  const cols = ['#ff8fc0','#b9a0ff','#ffb3d6','#a58bf5','#ff9dc8','#d3b3ff'];
  const spots = [[8,20],[38,8],[70,22],[20,120],[52,110],[76,128]];
  el.innerHTML = `<h2>🎈 Pop a Balloon</h2>
    <p class="hint">Tap the balloons for a little message</p>
    <div class="sky" id="sky"><div class="msg" id="msg"></div>
      ${spots.map((s,i) => `<button class="bl" data-i="${i}" aria-label="Balloon ${i+1}" style="left:${s[0]}%;top:${s[1]}px;--c:${cols[i]};animation-delay:${-i*.5}s"><i></i></button>`).join('')}
    </div>
    <button class="btn" id="cont" disabled>Memories 💌</button>`;
  const msg = $('#msg'); let popped = 0, hide;
  el.querySelectorAll('.bl').forEach(b => b.onclick = () => {
    if (b.classList.contains('popped')) return;
    b.classList.add('popped'); sfx('pop');
    const [x,y] = centerOf(b); confetti(x,y,45,.8);
    msg.classList.remove('show'); void msg.offsetWidth;
    msg.textContent = msgs[+b.dataset.i]; msg.classList.add('show');
    if (++popped === msgs.length){
      later(() => { sfx('chime'); confetti(...centerOf($('#sky')),130); $('#cont').disabled = false; }, 700);
    }
  });
  $('#cont').onclick = next;
},

/* 7b — our little world */
el => {
  const wishes = [
    {e:'🌸', t:`You're my favorite person, always.`},
    {e:'🌍', t:'Life feels better with you in it.'},
    {e:'✨', t:'You make my world a little brighter.'},
    {e:'🎂', t:'So lucky to have you.'},
    {e:'😂', t:'Thank you for every laugh and every secret.'},
    {e:'😘', t:'You never let me feel alone.'},
    {e:'🦋', t:`My forever partner in crime.`},
    {e:'🌙', t:'May every dream of yours come true.'}
  ];
  el.innerHTML = `<h2>Our Little World 🌍💜</h2>
    <p class="hint">✦ Just you, me and a lifetime of cute memories ✦</p>
    <div class="wgrid">${wishes.map((w,i) => `
      <div class="wcard" style="animation-delay:${i*.08}s"><span>${w.e}</span>${w.t}</div>`).join('')}
    </div>
    <button class="btn" id="cont">Read Wishes 🎁</button>`;
  $('#cont').onclick = next;
},

/* 8 — letter */
el => {
  el.innerHTML = `<h2>💌 A Little Letter</h2>
    <p class="hint" id="lh">Tap the envelope to open it</p>
    <div class="env" id="env"><div class="bk"></div><div class="fr"></div><div class="fp"></div><div class="seal">💜</div></div>
    <div class="paper" id="paper"></div>
    <button class="btn" id="cont" hidden>Make a Wish 🎂</button>`;
  const env = $('#env'), paper = $('#paper'), cont = $('#cont');
  let opened = false, typing = 0, pos = 0;
  const reveal = () => {
    clearInterval(typing); paper.textContent = LETTER;
    $('#lh').textContent = ''; cont.hidden = false;
  };
  const finish = () => { if (pos < LETTER.length) reveal(); };
  env.onclick = () => {
    if (opened) return; opened = true;
    sfx('chime'); env.classList.add('open'); $('#lh').textContent = 'Tap the letter to show it all';
    later(() => {
      env.classList.add('gone'); paper.classList.add('show'); confetti(...centerOf(paper),95);
      typing = every(() => {
        pos += 2; paper.textContent = LETTER.slice(0,pos);
        paper.scrollTop = paper.scrollHeight;
        if (pos >= LETTER.length) reveal();
      }, 28);
    }, 800);
  };
  paper.onclick = finish;
  $('#cont').onclick = next;
},

/* 9 — make a wish */
el => {
  el.innerHTML = `<h2>🎂 Make a Wish</h2>
    <p class="hint">Tap each candle to blow it out</p>
    <div class="cake">
      <div class="plate"></div><div class="t1"></div><div class="t2"></div>
      <button class="candle" style="left:68px" aria-label="Candle 1"><span class="flame"></span></button>
      <button class="candle" style="left:94px" aria-label="Candle 2"><span class="flame"></span></button>
      <button class="candle" style="left:120px" aria-label="Candle 3"><span class="flame"></span></button>
    </div>
    <div class="wishline" id="wl">Close your eyes and make a wish 🤍</div>
    <button class="btn" id="cont" disabled>See Final Surprise →</button>`;
  let out = 0;
  el.querySelectorAll('.candle').forEach(c => c.onclick = () => {
    if (c.classList.contains('out')) return;
    c.classList.add('out'); sfx('pop');
    const s = document.createElement('span'); s.className = 'smoke'; s.textContent = '💨'; c.appendChild(s);
    if (++out === 3){
      $('#wl').textContent = `Your wish will come true, ${NICK[2]}! ✨`;
      sfx('chime'); confetti(...centerOf(c),150); $('#cont').disabled = false;
    }
  });
  $('#cont').onclick = next;
},

/* 10 — miss you / virtual hug */
el => {
  el.innerHTML = avatar('🐼💗🧸', true, 'hug') +
    `<h1>Sending you a hug! 🤗</h1>
     <div class="big" id="missTxt" style="font-size:1.9rem">I MISS YOU</div>
     <p class="sub" id="hugsub">Tap for a virtual hug, ${NICK[0]}</p>
     <button class="btn" id="hug">💗 Click me 🤗 💜</button>`;
  let hugged = false;
  $('#hug').onclick = () => {
    if (hugged){ next(); return; }
    hugged = true;
    sfx('chime');
    heartBurst(...centerOf($('#hug')), 30);
    heartShower(55);
    $('#hugsub').textContent = `A big warm hug for you, ${NICK[2]} 💜`;
    $('#hug').textContent = 'One last thing 🎥';
  };
},

/* 11 — will you be my best friend forever */
el => {
  let no = 0;
  el.innerHTML = avatar('🐼💛🧸', true, 'bff') +
    `<h1>Will you be my best friend forever? 🐼</h1>
     <p class="sub">Just checking, ${NICK[0]} 😄</p>
     <div class="row2"><button class="btn" id="yes">YES! 💜</button><button class="btn ghost" id="no">NO</button></div>`;
  $('#yes').onclick = () => {
    sfx('chime'); setAvatar('🥰','bffYes');
    heartBurst(...centerOf($('#yes')), 30, BFF_EMOJI);
    heartShower(60, BFF_EMOJI);
    later(() => next(), 700);
  };
  const noBtn = $('#no');
  noBtn.onclick = () => {
    no++;
    sfx('whoosh');
    setAvatar('😤','bffNo');
    noBtn.style.transform = `translate(${(Math.random()-.5)*110}px,${(Math.random()-.5)*50}px)`;
    noBtn.style.transition = 'transform .25s';
    if (no >= 3){
      noBtn.disabled = true; noBtn.textContent = 'Nope 😤';
      later(() => { sfx('chime'); setAvatar('🥰','bffYes'); heartShower(60, BFF_EMOJI); next(); }, 500);
    }
  };
},

/* 12 — best friends forever */
el => {
  el.innerHTML = avatar('🐼💗🧸', true, 'yay') +
    `<h1>Yayyy! Best friends forever 🎉</h1>
     <p class="sub">Thank you for being you, ${NICK[0]}. I love you loads, today and always.<br>— ${FROM}</p>
     <button class="btn" id="cont">On To Your Birthday 🎂</button>`;
  sfx('chime'); later(() => confetti(W/2, H*.3, 130), 150);
  $('#cont').onclick = next;
},

/* 13 — finale */
el => {
  el.innerHTML = avatar('🐻💜🐼', true, 'finale') +
    `<h1>Happy Birthday, ${NAME}! 🎂</h1>
     <p class="sub" style="font-size:1.05rem;font-weight:600;margin-bottom:12px">My <span class="rot" id="rot" style="color:var(--accent)">${NICK[0]}</span> 💕</p>
     <p class="sub">Every day with you feels more special. Today, more than any other day, is a celebration of you. I hope your year is full of joy.<br>I love you so much 💜</p>
     <div class="row2"><button class="btn" id="again">Replay 🔁</button></div>
     <p class="fine">made with love, just for you</p>`;
  sfx('chime'); rain(120);
  let n = 0; const rot = $('#rot');
  every(() => {
    rot.style.opacity = 0;
    later(() => { n = (n+1) % NICK.length; rot.textContent = NICK[n]; rot.style.opacity = 1; }, 400);
  }, 2200);
  every(() => burst(60 + Math.random()*(W-120), 80 + Math.random()*(H*.5)), 750);
  later(() => burst(W*.3,H*.25), 200); later(() => burst(W*.7,H*.3), 450);
  $('#again').onclick = () => show(1);
}
];

show(0);
</script>
